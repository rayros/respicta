[package]
name = "respicta"
version = "0.4.3"
edition = "2021"
repository = "https://github.com/rayros/image-resizer"
readme = "README.md"
license = "MIT"
description = "Respicta is a versatile project offering a library, command-line interface (CLI), and web service for resizing images and changing their formats seamlessly."
keywords = ["image", "resize", "convert", "cli", "web-service"]
categories = ["multimedia::images", "command-line-interface", "web-programming::http-server"]
exclude = [".github", ".vscode", "tests"]

[dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"
# TODO Remove dependency after writing png and jpeg decoder for webp
image = "0.25.9"
libwebp-sys = "0.14.1"
magick_rust = "2.0.0"
oxipng = { version = "9.1.5", features = ["parallel", "zopfli", "filetime"], default-features = false }
tempfile = { version = "3.23.0", optional = true }
axum = { version = "0.8.7", features = ["multipart"], optional = true }
clap = { version = "4.5.53", features = ["derive"], optional = true }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "fs", "signal"], optional = true }
serde = { version = "1.0.215", features = ["derive"], optional = true }
derive_builder = "0.20.2"
ravif = "0.12.0"
png = "0.18.0"
rgb = "0.8.52"
resize = "0.8.8"
libheif-rs = { version = "2.5.1", default-features = false, features = ["v1_19"] }
jpeg-encoder = "0.6.1"

[dev-dependencies]
axum-test = "18.3.0"
reqwest = { version = "0.12.24", features = ["multipart"] }
serde_json = "1.0.145"

[features]
server-app-error = []
web-service = ["tokio", "axum", "tempfile", "server-app-error"]
command-server = ["tokio", "axum", "serde", "server-app-error"]
cli = ["clap", "web-service", "command-server"]

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["tokio"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["web-service"]

[[example]]
name = "client_n"
path = "examples/client_n.rs"
required-features = ["tokio"]
